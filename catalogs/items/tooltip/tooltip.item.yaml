slug: tooltip
name: Tooltip
summary: A popup that displays information related to an element when the element receives keyboard focus, the mouse hovers over it, or when it is pressed.
collection: react-native-reusables/components
readme: catalogs/items/tooltip/tooltip.md
classification:
  scope: component
  surfaces:
    - tooltip
    - overlay
  innerSurfaces:
    - text
  type: ui
  platforms:
    - ios
    - android
    - web
search:
  aliases:
    - hint
    - hover label
    - info popup
  phrases:
    - popup shown on hover, focus, or press
requirements:
  languages:
    - id: typescript
  frameworks:
    - id: react
      version: 19.2.3
    - id: react-native
      version: 0.85.3
    - id: expo
      sdkVersion: "56"
      supportsExpoGo: true
targets:
  - id: nativewind
    name: Nativewind
    requirements:
      languages:
        - id: typescript
          dependencies:
            - name: nativewind
              minVersion: 4.2.2
              reason: styling engine this version of the file is written for
            - name: "@rn-primitives/tooltip"
              version: 1.5.2
            - name: react-native-reanimated
              version: 4.3.1
              reason: native enter and exit animations
            - name: react-native-screens
              minVersion: 4.25.2
              reason: FullWindowOverlay so overlays render above native modals on iOS
      frameworks:
        - id: tailwind
          version: 3.4.14
    reference:
      shadcn: https://reactnativereusables.com/r/nativewind/tooltip.json
  - id: uniwind
    name: Uniwind
    requirements:
      languages:
        - id: typescript
          dependencies:
            - name: uniwind
              minVersion: 1.6.3
              reason: styling engine this version of the file is written for
            - name: "@rn-primitives/tooltip"
              version: 1.5.2
            - name: react-native-reanimated
              version: 4.3.1
              reason: native enter and exit animations
            - name: react-native-screens
              minVersion: 4.25.2
              reason: FullWindowOverlay so overlays render above native modals on iOS
    reference:
      shadcn: https://reactnativereusables.com/r/uniwind/tooltip.json
relationships:
  items:
    requires:
      - item: text
        reason: renders its text
      - item: native-only-animated-view
        reason: animates the content on native
demo:
  embedUrl: https://react-native-reusables-iframes.vercel.app/components/tooltip
  url: https://reactnativereusables.com/docs/components/tooltip
  qrCodeUrl: https://reactnativereusables.com/showcase/links/tooltip
  appStore: https://apps.apple.com/ca/app/react-native-reusables/id6748838250
  playStore: https://play.google.com/store/apps/details?id=com.reactnativereusables.android
