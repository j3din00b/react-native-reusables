slug: button
name: Button
summary: Displays a button or a component that looks like a button.
collection: react-native-reusables/components
readme: catalogs/items/button/button.md
variants:
  - default
  - destructive
  - outline
  - secondary
  - ghost
  - link
classification:
  scope: primitive
  surfaces:
    - button
  innerSurfaces:
    - text
  type: ui
  platforms:
    - ios
    - android
    - web
search:
  aliases:
    - cta
    - pressable
    - action button
    - icon button
    - loading button
  phrases:
    - button with text and icon variants
    - link styled as a button
requirements:
  languages:
    - id: typescript
  frameworks:
    - id: react
      version: 19.2.3
    - id: react-native
      version: 0.85.3
    - id: expo
      sdkVersion: "56"
      supportsExpoGo: true
targets:
  - id: nativewind
    name: Nativewind
    requirements:
      languages:
        - id: typescript
          dependencies:
            - name: nativewind
              minVersion: 4.2.2
              reason: styling engine this version of the file is written for
            - name: class-variance-authority
              minVersion: 0.7.1
              reason: builds the variant class names
      frameworks:
        - id: tailwind
          version: 3.4.14
    reference:
      shadcn: https://reactnativereusables.com/r/nativewind/button.json
  - id: uniwind
    name: Uniwind
    requirements:
      languages:
        - id: typescript
          dependencies:
            - name: uniwind
              minVersion: 1.6.3
              reason: styling engine this version of the file is written for
            - name: class-variance-authority
              minVersion: 0.7.1
              reason: builds the variant class names
    reference:
      shadcn: https://reactnativereusables.com/r/uniwind/button.json
relationships:
  items:
    requires:
      - item: text
        reason: renders its text
demo:
  embedUrl: https://react-native-reusables-iframes.vercel.app/components/button
  url: https://reactnativereusables.com/docs/components/button
  qrCodeUrl: https://reactnativereusables.com/showcase/links/button
  appStore: https://apps.apple.com/ca/app/react-native-reusables/id6748838250
  playStore: https://play.google.com/store/apps/details?id=com.reactnativereusables.android
