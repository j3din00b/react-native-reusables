slug: menubar
name: Menubar
summary: A visually persistent menu common in desktop applications that provides quick access to a consistent set of commands.
collection: react-native-reusables/components
readme: catalogs/items/menubar/menubar.md
classification:
  scope: component
  surfaces:
    - menu
    - navigation
  innerSurfaces:
    - text
  type: ui
  platforms:
    - ios
    - android
    - web
search:
  aliases:
    - menu bar
    - desktop menu
    - app menu
    - file edit view
  phrases:
    - persistent menu bar with nested submenus
requirements:
  languages:
    - id: typescript
  frameworks:
    - id: react
      version: 19.2.3
    - id: react-native
      version: 0.85.3
    - id: expo
      sdkVersion: "56"
      supportsExpoGo: true
targets:
  - id: nativewind
    name: Nativewind
    requirements:
      languages:
        - id: typescript
          dependencies:
            - name: nativewind
              minVersion: 4.2.2
              reason: styling engine this version of the file is written for
            - name: "@rn-primitives/menubar"
              version: 1.5.2
            - name: "@rn-primitives/portal"
              version: 1.5.2
              reason: renders the menu content in the root PortalHost
            - name: lucide-react-native
              minVersion: 0.577.0
              reason: icon set rendered through the Icon component
            - name: react-native-reanimated
              version: 4.3.1
              reason: native enter and exit animations
            - name: react-native-screens
              minVersion: 4.25.2
              reason: FullWindowOverlay so overlays render above native modals on iOS
      frameworks:
        - id: tailwind
          version: 3.4.14
    reference:
      shadcn: https://reactnativereusables.com/r/nativewind/menubar.json
  - id: uniwind
    name: Uniwind
    requirements:
      languages:
        - id: typescript
          dependencies:
            - name: uniwind
              minVersion: 1.6.3
              reason: styling engine this version of the file is written for
            - name: "@rn-primitives/menubar"
              version: 1.5.2
            - name: "@rn-primitives/portal"
              version: 1.5.2
              reason: renders the menu content in the root PortalHost
            - name: lucide-react-native
              minVersion: 0.577.0
              reason: icon set rendered through the Icon component
            - name: react-native-reanimated
              version: 4.3.1
              reason: native enter and exit animations
            - name: react-native-screens
              minVersion: 4.25.2
              reason: FullWindowOverlay so overlays render above native modals on iOS
    reference:
      shadcn: https://reactnativereusables.com/r/uniwind/menubar.json
relationships:
  items:
    requires:
      - item: text
        reason: renders its text
      - item: native-only-animated-view
        reason: animates the content on native
      - item: icon
        reason: renders its icons
demo:
