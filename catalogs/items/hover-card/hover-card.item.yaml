slug: hover-card
name: Hover Card
summary: For sighted users to preview content available behind a link.
collection: react-native-reusables/components
readme: catalogs/items/hover-card/hover-card.md
classification:
  scope: component
  surfaces:
    - overlay
    - card
  innerSurfaces:
    - avatar
    - text
  type: ui
  platforms:
    - ios
    - android
    - web
search:
  aliases:
    - link preview
    - preview card
    - profile preview
  phrases:
    - preview content behind a link on hover
requirements:
  languages:
    - id: typescript
  frameworks:
    - id: react
      version: 19.2.3
    - id: react-native
      version: 0.85.3
    - id: expo
      sdkVersion: "56"
      supportsExpoGo: true
targets:
  - id: nativewind
    name: Nativewind
    requirements:
      languages:
        - id: typescript
          dependencies:
            - name: nativewind
              minVersion: 4.2.2
              reason: styling engine this version of the file is written for
            - name: "@rn-primitives/hover-card"
              version: 1.5.2
            - name: react-native-reanimated
              version: 4.3.1
              reason: native enter and exit animations
            - name: react-native-screens
              minVersion: 4.25.2
              reason: FullWindowOverlay so overlays render above native modals on iOS
      frameworks:
        - id: tailwind
          version: 3.4.14
    reference:
      shadcn: https://reactnativereusables.com/r/nativewind/hover-card.json
  - id: uniwind
    name: Uniwind
    requirements:
      languages:
        - id: typescript
          dependencies:
            - name: uniwind
              minVersion: 1.6.3
              reason: styling engine this version of the file is written for
            - name: "@rn-primitives/hover-card"
              version: 1.5.2
            - name: react-native-reanimated
              version: 4.3.1
              reason: native enter and exit animations
            - name: react-native-screens
              minVersion: 4.25.2
              reason: FullWindowOverlay so overlays render above native modals on iOS
    reference:
      shadcn: https://reactnativereusables.com/r/uniwind/hover-card.json
relationships:
  items:
    requires:
      - item: text
        reason: renders its text
      - item: native-only-animated-view
        reason: animates the content on native
demo:
