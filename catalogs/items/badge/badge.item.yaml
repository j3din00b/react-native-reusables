slug: badge
name: Badge
summary: Displays a badge or a component that looks like a badge.
collection: react-native-reusables/components
readme: catalogs/items/badge/badge.md
variants:
  - default
  - secondary
  - destructive
  - outline
classification:
  scope: primitive
  surfaces:
    - badge
  innerSurfaces:
    - text
  type: ui
  platforms:
    - ios
    - android
    - web
search:
  aliases:
    - tag
    - chip
    - pill
    - label
  phrases:
    - small status label
requirements:
  languages:
    - id: typescript
  frameworks:
    - id: react
      version: 19.2.3
    - id: react-native
      version: 0.85.3
    - id: expo
      sdkVersion: "56"
      supportsExpoGo: true
targets:
  - id: nativewind
    name: Nativewind
    requirements:
      languages:
        - id: typescript
          dependencies:
            - name: nativewind
              minVersion: 4.2.2
              reason: styling engine this version of the file is written for
            - name: "@rn-primitives/slot"
              version: 1.5.2
            - name: class-variance-authority
              minVersion: 0.7.1
              reason: builds the variant class names
      frameworks:
        - id: tailwind
          version: 3.4.14
    reference:
      shadcn: https://reactnativereusables.com/r/nativewind/badge.json
  - id: uniwind
    name: Uniwind
    requirements:
      languages:
        - id: typescript
          dependencies:
            - name: uniwind
              minVersion: 1.6.3
              reason: styling engine this version of the file is written for
            - name: "@rn-primitives/slot"
              version: 1.5.2
            - name: class-variance-authority
              minVersion: 0.7.1
              reason: builds the variant class names
    reference:
      shadcn: https://reactnativereusables.com/r/uniwind/badge.json
relationships:
  items:
    requires:
      - item: text
        reason: renders its text
demo:
  embedUrl: https://react-native-reusables-iframes.vercel.app/components/badge
  url: https://reactnativereusables.com/docs/components/badge
  qrCodeUrl: https://reactnativereusables.com/showcase/links/badge
  appStore: https://apps.apple.com/ca/app/react-native-reusables/id6748838250
  playStore: https://play.google.com/store/apps/details?id=com.reactnativereusables.android
