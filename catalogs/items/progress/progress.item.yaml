slug: progress
name: Progress
summary: Displays an indicator showing the completion progress of a task, typically displayed as a progress bar.
collection: react-native-reusables/components
readme: catalogs/items/progress/progress.md
classification:
  scope: primitive
  surfaces:
    - loader
    - feedback
  type: ui
  platforms:
    - ios
    - android
    - web
search:
  aliases:
    - progress bar
    - completion indicator
    - percent bar
  phrases:
    - indicator showing completion progress
requirements:
  languages:
    - id: typescript
  frameworks:
    - id: react
      version: 19.2.3
    - id: react-native
      version: 0.85.3
    - id: expo
      sdkVersion: "56"
      supportsExpoGo: true
targets:
  - id: nativewind
    name: Nativewind
    requirements:
      languages:
        - id: typescript
          dependencies:
            - name: nativewind
              minVersion: 4.2.2
              reason: styling engine this version of the file is written for
            - name: "@rn-primitives/progress"
              version: 1.5.2
            - name: react-native-reanimated
              version: 4.3.1
              reason: native enter and exit animations
      frameworks:
        - id: tailwind
          version: 3.4.14
    reference:
      shadcn: https://reactnativereusables.com/r/nativewind/progress.json
  - id: uniwind
    name: Uniwind
    requirements:
      languages:
        - id: typescript
          dependencies:
            - name: uniwind
              minVersion: 1.6.3
              reason: styling engine this version of the file is written for
            - name: "@rn-primitives/progress"
              version: 1.5.2
            - name: react-native-reanimated
              version: 4.3.1
              reason: native enter and exit animations
    reference:
      shadcn: https://reactnativereusables.com/r/uniwind/progress.json
demo:
  embedUrl: https://react-native-reusables-iframes.vercel.app/components/progress
  url: https://reactnativereusables.com/docs/components/progress
