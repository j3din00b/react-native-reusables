slug: social-connections
name: Social Connections
summary: A set of buttons for authenticating through social providers.
collection: react-native-reusables/blocks
readme: catalogs/items/social-connections/social-connections.md
classification:
  scope: section
  surfaces:
    - button
  innerSurfaces:
    - button
  sectionTypes:
    - auth
  type: ui
  platforms:
    - ios
    - android
    - web
search:
  aliases:
    - oauth buttons
    - social login
    - sign in with apple
    - sign in with google
    - sign in with github
  phrases:
    - buttons for signing in through Apple, Google, and GitHub
requirements:
  languages:
    - id: typescript
  frameworks:
    - id: react
      version: 19.2.3
    - id: react-native
      version: 0.85.3
targets:
  axes:
    - id: styling
      name: Styling
      choices:
        - id: nativewind
          name: Nativewind
          requirements:
            languages:
              - id: typescript
                dependencies:
                  - name: nativewind
                    minVersion: 4.2.2
                    reason: styling engine this version of the file is written for
            frameworks:
              - id: tailwind
                version: 3.4.14
        - id: uniwind
          name: Uniwind
          requirements:
            languages:
              - id: typescript
                dependencies:
                  - name: uniwind
                    minVersion: 1.6.3
                    reason: styling engine this version of the file is written for
    - id: integration
      name: Auth integration
      choices:
        - id: social-connections
          name: None (bring your own auth)
          requirements:
            frameworks:
              - id: expo
                sdkVersion: "56"
                supportsExpoGo: true
        - id: social-connections-clerk
          name: Clerk
          requirements:
            languages:
              - id: typescript
                dependencies:
                  - name: "@clerk/expo"
                    minVersion: 3.2.7
                    reason: Clerk hooks that power the sign-in logic
                  - name: expo-auth-session
                    version: 56.0.14
                    reason: redirect URL for the Clerk SSO flow
                  - name: expo-web-browser
                    reason: opens the provider's sign-in page in a browser session
            frameworks:
              - id: expo
                sdkVersion: "56"
                requiresDevClient: true
  reference:
    shadcn: https://reactnativereusables.com/r/{styling}/{integration}.json
relationships:
  items:
    requires:
      - item: button
        reason: used inside this block
demo:
  embedUrl: https://react-native-reusables-iframes.vercel.app/blocks/social-connections
  url: https://reactnativereusables.com/docs/blocks/authentication/social-connections
