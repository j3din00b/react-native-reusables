# The catalog manifest for founded-labs.
# Publishing guide for your agent: `ctlgs print authoring-guide` (or the MCP's get_authoring_guide tool).
# `ctlgs validate` checks schema, path safety, and references locally.
# Items live in catalogs/items/<slug>/<slug>.item.yaml beside their readme.
schemaVersion: 4
team: founded-labs
teamName: Founded Labs
teamSummary: "A React Native studio and product lab. We design and build iOS and Android apps with React Native and Expo, and make open source tools: React Native Reusables, rn-primitives, NativewindUI, and Catalogs."
teamLinks:
  website: https://foundedlabs.com
  github: https://github.com/founded-labs
manifests:
  inline:
    collections:
      - slug: react-native-reusables
        name: React Native Reusables
        summary: "shadcn/ui brought to React Native: copy-and-paste components and auth blocks for iOS, Android, and web, styled with Nativewind or Uniwind."
        license: MIT
        readme: catalogs/collections/react-native-reusables/react-native-reusables.md
        guides:
          - path: catalogs/guides/project-setup.md
            title: Add the cn helper and the theme color variables the files use
            when: The project has no components.json file.
    subCollections:
      - slug: components
        name: Components
        collection: react-native-reusables
        summary: Accessible building blocks, from buttons and inputs to menus, dialogs, and tabs, each shipped for Nativewind and Uniwind.
      - slug: blocks
        name: Blocks
        collection: react-native-reusables
        summary: Ready-made authentication screens and menus, with an optional Clerk integration wired in.
  refs:
    items:
      - catalogs/items/**/*.item.yaml
